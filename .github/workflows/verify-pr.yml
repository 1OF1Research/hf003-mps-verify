name: verify-pr-branch

# Stock-vs-PR proof for the MPS SDPA float-mask workaround PR
# (transformers#44247). Same pairing as verify.yml — macos-15 +
# torch 2.8.0, the pin inside the bug's window where MPS initializes
# on this runner — but transformers comes from the PR branch instead
# of the 5.23.0 release, so Part B exercises the actual PR code
# end-to-end on the device. The PR's own unit tests run afterwards
# from a checkout of the same branch.

on:
  workflow_dispatch:

jobs:
  verify-pr:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe hardware
        run: |
          uname -a
          sysctl -n machdep.cpu.brand_string

      - name: Install pinned stack with transformers from the PR branch
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.8.0 "transformers @ git+https://github.com/1OF1Research/transformers@fix-mps-sdpa-float-mask-workaround"

      - name: Probe MPS availability
        run: python probe_mps.py

      - name: Run verification script against the PR branch
        run: |
          set -o pipefail
          python verify_mps_sdpa.py 2>&1 | tee verify-pr-output.log

      - name: Upload PR run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-pr-output
          path: verify-pr-output.log

      - name: Run the PR's unit tests from the branch checkout
        run: |
          git clone --depth 1 --branch fix-mps-sdpa-float-mask-workaround https://github.com/1OF1Research/transformers.git tf-pr
          pip install pytest pytest-xdist parameterized
          cd tf-pr
          PYTHONPATH=$PWD/src python -m pytest tests/integrations/test_sdpa_attention.py -v 2>&1 | tee ../pr-unit-tests.log

      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-unit-tests
          path: pr-unit-tests.log
